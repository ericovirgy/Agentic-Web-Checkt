name: Validation (manual)

# Release-validation evidence gathered on GitHub-hosted runners, which have open network access.
# Not part of CI. Produces artifacts only; nothing is published.
on:
  workflow_dispatch:
    inputs:
      real-world:
        description: Run the real-world validation dataset (baseline agent)
        type: boolean
        default: true
      real-model:
        description: Run the real-model smoke task (Ollama, CPU)
        type: boolean
        default: true
      model:
        description: Ollama model for the real-model smoke task
        type: string
        default: qwen2.5:3b

permissions:
  contents: read

jobs:
  real-world:
    if: ${{ inputs.real-world }}
    name: Real-world validation scans
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Run the real-world validation dataset
        run: |
          pnpm bench --dataset benchmark/datasets/real-world-validation.json --out validation/real-world --pages 3 --timeout 45000
      - name: Show summary and evidence (also printed to the log; artifacts may be unreachable from some networks)
        if: always()
        run: |
          cat validation/real-world/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          echo "===== SUMMARY.MD ====="; cat validation/real-world/summary.md || true
          echo "===== EVIDENCE ====="
          node -e '
            const fs = require("fs"); const path = require("path");
            const root = "validation/real-world";
            for (const id of fs.readdirSync(root)) {
              const f = path.join(root, id, "run-1.json"); if (!fs.existsSync(f)) continue;
              const r = JSON.parse(fs.readFileSync(f, "utf8"));
              console.log(`### ${id} ${r.meta.url} overall=${r.overall} pages=${r.pages.map(p => `${p.finalUrl} [${p.status}]`).join(" | ")}`);
              for (const c of r.checks.filter(c => c.status === "fail" || c.status === "warn")) console.log(`  ${c.status.toUpperCase()} ${c.id}: ${c.summary} :: ${JSON.stringify(c.evidence.slice(0, 2)).slice(0, 400)}`);
              for (const t of r.tasks) console.log(`  TASK ${t.name} ${t.verdict} (${t.steps.length} steps): ${t.reason} :: ${t.steps.map(s => `${s.tool} ${JSON.stringify(s.args)} -> ${s.result.split("\n")[0].slice(0, 80)}`).join(" ; ").slice(0, 600)}`);
            }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-world-validation
          path: validation/real-world
          retention-days: 30

  real-model:
    if: ${{ inputs.real-model }}
    name: Real-model smoke task (Ollama)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm build
      - name: Install Ollama and pull the model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break; sleep 1; done
          ollama pull "${{ inputs.model }}"
          ollama list
      - name: Start the fixture site
        run: |
          nohup npx tsx fixtures/server.ts excellent 4311 > fixture.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4311/ > /dev/null && break; sleep 1; done
      - name: Run the behavioural tasks with the real model
        env:
          AWC_LLM_BASE_URL: http://127.0.0.1:11434/v1
          AWC_LLM_API_KEY: ollama
        run: |
          set +e
          start=$(date +%s)
          node dist/cli.js test http://127.0.0.1:4311/ --agent llm --provider openai --model "${{ inputs.model }}" \
            --tasks default --max-steps 8 --timeout 120000 --pages 1 --no-color -v --out validation/real-model
          echo "exit=$?" | tee validation/real-model/exit.txt
          echo "elapsed_s=$(( $(date +%s) - start ))" | tee -a validation/real-model/exit.txt
          ollama ps || true
      - name: Show summary
        if: always()
        run: |
          { echo "## Real-model smoke task (${{ inputs.model }})"; cat validation/real-model/exit.txt; echo; cat validation/real-model/summary.md; } >> "$GITHUB_STEP_SUMMARY" || true
          echo "===== RESULTS.JSON (tasks) ====="; node -e 'const r=require("./validation/real-model/results.json"); console.log(JSON.stringify({meta:r.meta, tasks:r.tasks.map(t=>({name:t.name,verdict:t.verdict,reason:t.reason,steps:t.steps.map(s=>({tool:s.tool,args:s.args,result:s.result.split("\n")[0].slice(0,120),ms:s.durationMs})),assertions:t.assertions,usage:t.usage,durationMs:t.durationMs}))}, null, 1))' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-model-smoke
          path: |
            validation/real-model
            ollama.log
          retention-days: 30
