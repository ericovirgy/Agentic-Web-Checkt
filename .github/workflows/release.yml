name: Release

# Publishes to npm with npm Trusted Publishing (GitHub Actions OIDC): no long-lived NPM_TOKEN.
# The trusted publisher configured on npmjs.com must name this repository, this file (release.yml)
# and no environment. Provenance is generated automatically for a public repository and package.
# `workflow_dispatch` with dry-run runs every step except the publish, the GitHub release and the tag move.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run tests, build, pack and `npm publish --dry-run` without publishing anything
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish to npm and create the GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use an npm version that supports Trusted Publishing (>= 11.5.1)
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Check that the tag matches package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$DRY_RUN" = "true" ]; then
            version="$pkg_version"
            echo "Dry run on $TAG: using package.json version $version"
          else
            version="${TAG#v}"
            if [ "$version" != "$pkg_version" ]; then
              echo "::error::Tag $TAG does not match package.json version $pkg_version"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "major=v${version%%.*}" >> "$GITHUB_OUTPUT"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack tarball for the release assets
        run: npm pack

      - name: Publish dry run (what would be published)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm publish --dry-run --access public

      - name: Check whether this version is already on npm
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$name@$VERSION is already on the registry; the publish step will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (Trusted Publishing, OIDC)
        if: ${{ github.event_name == 'push' && steps.published.outputs.exists != 'true' }}
        env:
          NPM_TAG: ${{ steps.version.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: npm publish --access public --tag "$NPM_TAG"

      - name: Extract release notes from CHANGELOG.md
        if: ${{ github.event_name == 'push' }}
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          : > "$notes_file"
          if [ -f CHANGELOG.md ]; then
            # Copy the "## [x.y.z]" / "## x.y.z" section for this version, up to the next "## " heading.
            awk -v v="$VERSION" '
              /^## / {
                if (found) exit
                if (index($0, "[" v "]") || index($0, "## " v " ") || $0 == "## " v || index($0, "## v" v)) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md > "$notes_file"
          fi
          if [ -s "$notes_file" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG.md section for $VERSION; GitHub will generate the release notes."
          fi
          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.found == 'true' && steps.notes.outputs.file || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            ./*.tgz

      - name: Move the major version tag
        if: ${{ github.event_name == 'push' && steps.version.outputs.prerelease != 'true' }}
        env:
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"
          echo "Moved $MAJOR to $GITHUB_SHA"
